name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&locale=kr
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&locale=kr&theme=tokyonight
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}

      # Custom script instead of the stock top-langs card: includes collaborator
      # and org repos, weighted by my commit share (see scripts/gen-top-langs.mjs).
      - name: Top languages cards
        run: |
          npm install --no-save @stats-organization/github-readme-stats-core@2.1.5
          node scripts/gen-top-langs.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
